<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Sindicato de Operarios</title>
<style>
:root{--y:#ffc400;--b:#111;--g:#18a957;--r:#d93636}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#111}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;position:relative;overflow:hidden}
header{background:#111;color:#fff;padding:18px 20px 16px;position:sticky;top:0;z-index:5}.brand{font-weight:900}.brand span{color:var(--y)}
main{padding:20px;padding-bottom:88px}.hero{background:linear-gradient(145deg,#111,#292929);color:#fff;border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 10px 30px #0002}.logo{font-size:25px;font-weight:900;line-height:1.05}.logo span{color:var(--y)}
.mini,.muted{color:#73777c;font-size:13px}.hero .mini{color:#ccc}.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}.primary{background:var(--y);color:#111}.dark{background:#111;color:#fff}.outline{background:#fff;border:1px solid #ddd}.card{background:#fff;border:1px solid #e8e8e8;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 4px 15px #0000000a}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:22px;font-weight:900;margin:4px 0 14px}.h3{font-size:16px;font-weight:900}.progress{height:8px;background:#ececec;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--y)}.topic{display:flex;align-items:center;gap:12px}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-weight:900}.topic.done .num{background:var(--g)}.topic.current{border:2px solid var(--y)}.topic.locked{opacity:.55}.question{font-size:18px;font-weight:800;line-height:1.3}.answer{background:#fff;border:1px solid #ddd;text-align:left}.answer.correct{background:#dff7e8;border-color:#8bd8ad}.answer.wrong{background:#ffe2e2;border-color:#ef9b9b}.result{font-size:42px;font-weight:1000;text-align:center}.center{text-align:center}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}.bottom button{flex:1;border:0;background:#fff;padding:12px 3px;font-size:11px;font-weight:800}.bottom b{display:block;font-size:18px}.hidden{display:none!important}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;margin:6px 0 10px;font-size:15px}label{font-size:12px;font-weight:800}.back{background:none;border:0;color:#111;font-size:18px;margin-right:8px}
.cert-preview{background:#fff;border:7px solid #111;padding:18px;text-align:center;box-shadow:0 8px 25px #0002}.cert-head{border-bottom:2px solid var(--y);padding-bottom:10px}.so{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#111;color:var(--y);font-weight:1000;font-size:18px}.cert-name{font-size:24px;font-weight:900;margin:12px 0 4px;overflow-wrap:anywhere}.cert-course{font-size:17px;font-weight:900}.qrbox{display:flex;justify-content:center;margin:12px 0}.verify{font-size:11px;color:#666;word-break:break-all}
@media print{body{background:#fff}.app{max-width:none}.app>header,.bottom,main>.title,main>.btn,main>.back{display:none!important}main{padding:0}.cert-preview{width:100%;min-height:180mm;border:5px solid #111;box-shadow:none;padding:25px}.cert-name{font-size:26px}.no-print{display:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="app">
<header><div class="brand">🚜 <span>SINDICATO</span> DE OPERARIOS</div></header>
<main id="screen"></main>
<nav class="bottom hidden" id="nav">
<button onclick="show('home')"><b>⌂</b>Inicio</button><button onclick="show('course')"><b>▣</b>Curso</button><button onclick="show('test')"><b>✓</b>Test</button><button onclick="show('cert')"><b>▤</b>Certificado</button><button onclick="show('profile')"><b>●</b>Perfil</button>
</nav>
</div>
<script>
const topics=[["Introducción","Qué es una carretilla y sus usos."],["Tipos de carretillas","Características y aplicaciones."],["Riesgos","Principales riesgos durante la utilización."],["Seguridad","Normas de seguridad y prevención."],["Conducción","Circulación y maniobras."],["Estabilidad","Centro de gravedad y carga."],["Mantenimiento","Comprobaciones básicas."],["Normativa","Obligaciones y buenas prácticas."]];
const qs=[["¿Qué debe hacerse antes de comenzar a utilizar una carretilla?",["Aumentar la velocidad","Comprobar el estado de la carretilla","Elevar las horquillas al máximo","Cargar inmediatamente"],1],["¿Qué factor influye directamente en la estabilidad?",["El color","La distribución de la carga","El ruido","La marca"],1],["Durante la circulación, la carga debe transportarse…",["De forma estable y segura","Siempre elevada al máximo","Sin mirar el entorno","Fuera de la capacidad"],0],["Antes de usar una carretilla se deben realizar…",["Comprobaciones","Solo fotografías","Ninguna revisión","Únicamente una prueba de velocidad"],0],["¿Quién debe utilizar una carretilla?",["Cualquier persona","Personal formado y autorizado conforme a las reglas aplicables","Solo visitantes","Nadie"],1]];
const PASS=70;
let state=JSON.parse(localStorage.getItem('sdo_state')||'null')||{user:null,done:[],paid:false,passed:false,score:0,affiliate:null,certificate:null};
function save(){localStorage.setItem('sdo_state',JSON.stringify(state))}
function uid(prefix){return prefix+'-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase()}
function affiliate(){return state.user?.affiliate||'SDO-'+new Date().getFullYear()+'-'+Math.floor(100000+Math.random()*900000)}
function shell(b){document.getElementById('screen').innerHTML=b}
function show(s){
 document.getElementById('nav').classList.toggle('hidden',!state.user);
 const v=new URLSearchParams(location.search).get('verify'); if(v&&!state.user)return verify(v);
 if(s==='welcome')return shell('<section class="hero" style="margin-top:25px"><div class="logo">🚜<br><span>SINDICATO DE OPERARIOS</span></div><p>Formación online para operadores de carretillas.</p><div class="mini">ESTUDIAR Y HACER EL TEST ES GRATIS.<br>SOLO PAGAS AL FINAL SI QUIERES OBTENER TU CERTIFICADO.</div><button class="btn primary" onclick="show(\'register\')">EMPEZAR GRATIS</button><button class="btn dark" onclick="show(\'login\')">INICIAR SESIÓN</button></section><div class="card"><div class="h3">¿Qué obtienes al formar parte del Sindicato?</div><p>✓ Formación accesible y pruebas online.</p><p>✓ Comunidad de operarios y recursos.</p><p>✓ Tu perfil y número de afiliado.</p><p>✓ Certificado digital verificable cuando apruebes.</p></div>');
 if(s==='register')return shell('<button class="back" onclick="show(\'welcome\')">←</button><div class="title">Únete gratis</div><div class="card"><label>Nombre</label><input id="name"><label>Apellidos</label><input id="surname"><label>DNI / NIE</label><input id="dni"><label>Email</label><input id="email" type="email"><label>Contraseña</label><input id="pass" type="password"><label><input id="terms" type="checkbox" style="width:auto"> Acepto las condiciones y política de privacidad.</label><button class="btn primary" onclick="register()">CREAR CUENTA GRATIS</button></div>');
 if(s==='login')return shell('<button class="back" onclick="show(\'welcome\')">←</button><div class="title">Iniciar sesión</div><div class="card"><label>Email</label><input id="lemail" type="email"><label>Contraseña</label><input id="lpass" type="password"><button class="btn primary" onclick="login()">INICIAR SESIÓN</button><button class="btn outline" onclick="demo()">ENTRAR EN MODO DEMO</button></div>');
 if(!state.user)return show('welcome');
 if(s==='home')return home();if(s==='course')return course();if(s==='topic')return topic();if(s==='test')return test();if(s==='exam')return exam();if(s==='result')return result();if(s==='pay')return pay();if(s==='paid')return paid();if(s==='cert')return cert();if(s==='profile')return profile();
}
function register(){let name=document.getElementById('name').value.trim(),surname=document.getElementById('surname').value.trim(),dni=document.getElementById('dni').value.trim(),email=document.getElementById('email').value.trim(),terms=document.getElementById('terms').checked;if(!name||!surname||!email||!terms)return alert('Completa los datos y acepta las condiciones.');state.user={name,surname,dni,email,affiliate:affiliate()};state.affiliate=state.user.affiliate;save();show('home')}
function login(){state.user={name:'Carlos',surname:'García López',dni:'12345678A',email:document.getElementById('lemail').value||'alumno@ejemplo.com',affiliate:state.affiliate||affiliate()};state.affiliate=state.user.affiliate;save();show('home')}
function demo(){state.user={name:'Carlos',surname:'García López',dni:'12345678A',email:'alumno@ejemplo.com',affiliate:state.affiliate||affiliate()};state.affiliate=state.user.affiliate;save();show('home')}
function home(){let p=Math.round(state.done.length/topics.length*100);shell('<div class="title">Hola, '+state.user.name+' 👋</div><div class="card"><div class="row"><div><div class="h3">Operario de Carretillas Elevadoras, Frontales y Retráctiles</div><div class="muted">Formación y test gratuitos</div></div><b>'+p+'%</b></div><div class="progress"><i style="width:'+p+'%"></i></div><button class="btn primary" onclick="show(\'course\')">CONTINUAR FORMACIÓN</button></div><div class="card"><div class="h3">Tu afiliación</div><p>Nº de afiliado: <b>'+state.user.affiliate+'</b></p><p>Formación: <b>GRATIS</b></p><p>Certificado: <b>4,99 € solo después de aprobar</b></p></div><div class="card"><div class="h3">Estado</div><p>Temas: <b>'+state.done.length+'/'+topics.length+'</b></p><p>Examen: '+(state.passed?'✅ Aprobado':'🔒 Pendiente')+'</p><p>Certificado: '+(state.paid?'✅ Disponible':'🔒 Pendiente')+'</p></div>');
}
function course(){let p=Math.round(state.done.length/topics.length*100);shell('<button class="back" onclick="show(\'home\')">←</button><div class="title">Temario</div><div class="muted">'+topics.length+' temas · '+p+'% completado · GRATIS</div>'+topics.map((t,i)=>{let done=state.done.includes(i),locked=i>0&&!state.done.includes(i-1)&&!done;return '<div class="card topic '+(done?'done':'')+' '+(locked?'locked':'')+' '+(!done&&!locked?'current':'')+'" onclick="'+(locked?"alert('Completa primero el tema anterior.')":"openTopic("+i+")")+'"><div class="num">'+(done?'✓':i+1)+'</div><div style="flex:1"><div class="h3">'+t[0]+'</div><div class="muted">'+t[1]+'</div></div><span>'+(done?'✓':locked?'🔒':'›')+'</span></div>'}).join('')+(state.done.length===topics.length?'<button class="btn primary" onclick="show(\'exam\')">REALIZAR EXAMEN FINAL GRATIS</button>':'')}
let currentTopic=0;function openTopic(i){currentTopic=i;show('topic')}function topic(){let t=topics[currentTopic];shell('<button class="back" onclick="show(\'course\')">←</button><div class="title">Tema '+(currentTopic+1)+' de '+topics.length+'</div><div class="card"><div style="font-size:44px">🚜</div><div class="h3">'+t[0]+'</div><p>'+t[1]+'</p><p>Aprende los principios esenciales para la operación segura de carretillas elevadoras.</p><h3>Puntos clave</h3><p>✓ Formación adecuada antes de operar.</p><p>✓ Comprobación del equipo.</p><p>✓ Circulación y maniobras seguras.</p><p>✓ Respeto de la carga y estabilidad.</p><button class="btn primary" onclick="completeTopic()">MARCAR COMO COMPLETADO</button></div>')}
function completeTopic(){if(!state.done.includes(currentTopic))state.done.push(currentTopic);save();show(currentTopic<topics.length-1?'course':'home')}
let qi=0;function test(){qi=0;renderQ()}function renderQ(){let q=qs[qi];shell('<button class="back" onclick="show(\'home\')">←</button><div class="title">Test de práctica GRATIS</div><div class="muted">Pregunta '+(qi+1)+' de '+qs.length+'</div><div class="card"><div class="question">'+q[0]+'</div>'+q[1].map((a,i)=>'<button class="btn answer" onclick="practiceAnswer('+i+')">'+a+'</button>').join('')+'</div>')}function practiceAnswer(i){let q=qs[qi];document.querySelectorAll('.answer')[i].classList.add(i===q[2]?'correct':'wrong');setTimeout(()=>{qi++;if(qi<qs.length)renderQ();else show('home')},500)}
let eq=0,escore=0;function exam(){if(state.done.length<topics.length)return alert('Completa todos los temas antes del examen.');eq=0;escore=0;renderExam()}function renderExam(){let q=qs[eq%qs.length];shell('<div class="title">Examen final GRATIS</div><div class="row muted"><span>5 preguntas</span><span>Aprobado: '+PASS+'%</span></div><div class="card"><div class="muted">Pregunta '+(eq+1)+' de 5</div><div class="question" style="margin-top:10px">'+q[0]+'</div>'+q[1].map((a,i)=>'<button class="btn answer" onclick="examAnswer('+i+')">'+a+'</button>').join('')+'</div>')}function examAnswer(i){let q=qs[eq%qs.length];if(i===q[2])escore++;document.querySelectorAll('.answer')[i].classList.add(i===q[2]?'correct':'wrong');setTimeout(()=>{eq++;if(eq<5)renderExam();else{state.score=escore;state.passed=escore*20>=PASS;save();show('result')}},350)}
function result(){let pct=state.score*20;shell('<div class="card center" style="margin-top:35px"><div class="result">'+(state.passed?'✓':'×')+'</div><h2>'+(state.passed?'¡APROBADO!':'NO SUPERADO')+'</h2><div style="font-size:30px;font-weight:900">'+state.score+' / 5</div><p>'+pct+'%</p><p>'+(state.passed?'Has superado el examen. La formación y el test han sido gratuitos.':'Necesitas al menos un '+PASS+'% para aprobar.')+'</p>'+(state.passed?'<button class="btn primary" onclick="show(\'pay\')">OBTENER CERTIFICADO · 4,99 €</button>':'<button class="btn dark" onclick="show(\'exam\')">REPETIR EXAMEN GRATIS</button>')+'</div>')}
function pay(){shell('<button class="back" onclick="show(\'result\')">←</button><div class="title">Certificado</div><div class="card"><div class="h3">Solo pagas al final si quieres obtener tu certificado</div><div style="font-size:34px;font-weight:1000;margin:8px 0">4,99 €</div><p>✓ Formación gratuita</p><p>✓ Test y examen gratuitos</p><p>✓ Certificado digital</p><p>✓ Número de afiliado</p><p>✓ QR de verificación</p><button class="btn primary" onclick="fakePay()">PAGAR 4,99 € (DEMO)</button><div class="muted center" style="margin-top:10px">Modo demostración: no se realiza ningún cargo.</div></div>')}
function fakePay(){state.paid=true;if(!state.certificate)state.certificate=uid('SDO-CERT');save();show('paid')}
function paid(){shell('<div class="card center" style="margin-top:40px"><div style="font-size:60px">✓</div><h2>Certificado disponible</h2><p>Tu formación ha quedado registrada en esta demo.</p><button class="btn primary" onclick="show(\'cert\')">VER Y DESCARGAR PDF</button></div>')}
function cert(){if(!state.paid)return shell('<div class="card center"><h2>Certificado bloqueado</h2><p>Solo está disponible después de aprobar y solicitar el certificado.</p></div>');let u=state.user,c=state.certificate||uid('SDO-CERT');state.certificate=c;save();let date=new Date().toLocaleDateString('es-ES');setTimeout(()=>makeQR(c),50);shell('<div class="title">Certificado profesional</div><div class="cert-preview" id="certificate"><div class="cert-head"><div class="so">SO</div><div style="font-size:20px;font-weight:1000;margin-top:6px">SINDICATO DE OPERARIOS</div><div class="muted">CERTIFICADO DIGITAL DE FORMACIÓN</div></div><p>Se certifica que</p><div class="cert-name">'+u.name+' '+u.surname+'</div><p class="muted">DNI/NIE: '+(u.dni||'—')+' · '+u.email+'</p><p>ha superado satisfactoriamente la formación:</p><div class="cert-course">Operario de Carretillas Elevadoras, Frontales y Retráctiles</div><p><b>Nº de afiliado:</b> '+u.affiliate+'</p><p><b>Nº de certificado:</b> '+c+'</p><p><b>Fecha de emisión:</b> '+date+'</p><div class="qrbox"><div id="qrcode"></div></div><div class="verify">Verificación: '+location.origin+location.pathname+'?verify='+c+'</div></div><button class="btn primary no-print" onclick="downloadPDF()">DESCARGAR PDF</button><button class="btn outline no-print" onclick="window.print()">IMPRIMIR / GUARDAR PDF</button>')}
function makeQR(c){let el=document.getElementById('qrcode');if(!el)return;el.innerHTML='';new QRCode(el,{text:location.origin+location.pathname+'?verify='+encodeURIComponent(c),width:100,height:100,correctLevel:QRCode.CorrectLevel.M})}
function verify(code){shell('<div class="card center" style="margin-top:35px"><div class="so">SO</div><h2>SINDICATO DE OPERARIOS</h2><div style="font-size:40px">✓</div><h3>VERIFICACIÓN DE CERTIFICADO</h3><p>Este enlace corresponde al certificado <b>'+code+'</b>.</p><p class="muted">La verificación pública confirma el identificador del documento generado por esta plataforma.</p><button class="btn dark" onclick="location.href=location.pathname">VOLVER A LA WEB</button></div>')}
async function downloadPDF(){if(!window.jspdf)return window.print();let u=state.user,c=state.certificate,date=new Date().toLocaleDateString('es-ES'),qr=document.querySelector('#qrcode canvas');const {jsPDF}=window.jspdf;let pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});pdf.setDrawColor(17,17,17);pdf.setLineWidth(2);pdf.rect(8,8,281,194);pdf.setFillColor(17,17,17);pdf.circle(28,29,12,'F');pdf.setTextColor(255,196,0);pdf.setFontSize(12);pdf.setFont(undefined,'bold');pdf.text('SO',28,33,{align:'center'});pdf.setTextColor(17,17,17);pdf.setFontSize(22);pdf.text('SINDICATO DE OPERARIOS',44,29);pdf.setFontSize(10);pdf.setTextColor(100,100,100);pdf.text('CERTIFICADO DIGITAL DE FORMACIÓN',44,36);pdf.setDrawColor(255,196,0);pdf.line(20,45,276,45);pdf.setTextColor(80,80,80);pdf.setFontSize(11);pdf.text('Se certifica que',148,60,{align:'center'});pdf.setTextColor(17,17,17);pdf.setFontSize(22);pdf.text(u.name+' '+u.surname,148,72,{align:'center',maxWidth:235});pdf.setFontSize(9);pdf.setTextColor(90,90,90);pdf.text('DNI/NIE: '+(u.dni||'—')+'  |  '+u.email,148,80,{align:'center'});pdf.setTextColor(17,17,17);pdf.setFontSize(11);pdf.text('ha superado satisfactoriamente la formación:',148,94,{align:'center'});pdf.setFontSize(14);pdf.setFont(undefined,'bold');pdf.text('Operario de Carretillas Elevadoras, Frontales y Retráctiles',148,105,{align:'center',maxWidth:235});pdf.setFont(undefined,'normal');pdf.setFontSize(10);pdf.text('Nº de afiliado: '+u.affiliate,35,124);pdf.text('Nº de certificado: '+c,35,133);pdf.text('Fecha de emisión: '+date,35,142);if(qr){pdf.addImage(qr.toDataURL('image/png'),'PNG',230,118,34,34)}pdf.setFontSize(8);pdf.setTextColor(100,100,100);pdf.text('Documento verificable mediante QR',247,157,{align:'center'});pdf.text('Sindicato de Operarios · Formación online',148,185,{align:'center'});pdf.save(c+'.pdf')}
function profile(){shell('<div class="title">Mi perfil</div><div class="card"><div class="h3">'+state.user.name+' '+state.user.surname+'</div><div class="muted">'+state.user.email+'</div><p>DNI/NIE: '+(state.user.dni||'—')+'</p><p>Nº de afiliado: <b>'+state.user.affiliate+'</b></p><p>Certificado: '+(state.certificate||'Pendiente')+'</p></div><button class="btn outline" onclick="state.user=null;save();show(\'welcome\')">CERRAR SESIÓN</button>')}
if(state.user)show('home');else show('welcome');
</script>
</body>
</html>
